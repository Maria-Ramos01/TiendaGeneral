{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Centro Comercial{% endblock %}</title>
    
    <!-- CSS Base del Marketplace -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    
    <!-- CSS Específico de cada Tienda -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="/">Inicio Centro Comercial</a>
            <a href="/carrito/">🛒 Carrito (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- JS Base / Carrito -->
    <script src="{% static 'js/cart.js' %}"></script>
    
    <!-- JS Específico de cada Tienda -->
    {% block extra_js %}{% endblock %}
</body>
</html>
